name: Build Rahul Super Mart Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Official Release Keystore
        run: |
          keytool -genkeypair -v -keystore rahul-release.jks -alias rahulkey -keyalg RSA -keysize 2048 -validity 10000 -storepass RahulMart2026 -keypass RahulMart2026 -dname "CN=Rahul Super Mart, OU=Wholesale, O=Vishal Telecom Pvt Ltd, L=Sikta, ST=Bihar, C=IN"
          ls -la rahul-release.jks

      - name: Build Release APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle_output.log

      - name: Upload Gradle Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle_output.log

      - name: Align and Sign APK with Official Release Key (apksigner)
        run: |
          mkdir -p release-output
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools: $BUILD_TOOLS_DIR"
          
          # Locate built unsigned release apk
          RAW_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found raw APK: $RAW_APK"

          # 4-byte Zipalign optimization
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" release-output/RahulSuperMart-aligned.apk

          # Sign with apksigner (v1, v2, v3 schemes)
          $BUILD_TOOLS_DIR/apksigner sign --ks rahul-release.jks --ks-pass pass:RahulMart2026 --key-pass pass:RahulMart2026 --ks-key-alias rahulkey --out release-output/RahulSuperMart.apk release-output/RahulSuperMart-aligned.apk

          # Verify signature integrity
          $BUILD_TOOLS_DIR/apksigner verify --verbose release-output/RahulSuperMart.apk
          ls -lh release-output/RahulSuperMart.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RahulSuperMart-APK
          path: release-output/RahulSuperMart.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "Rahul Super Mart Official Android App v1.0.0"
          body: |
            ## Rahul Super Mart B2B Wholesale - Official Android App (.apk)
            
            Download and install the official Android App for **Rahul Super Mart**:
            
            - **App Name**: Rahul Super Mart
            - **Package**: `com.rahulsupermart.app`
            - **Platform**: Android 7.0 and higher (API 24+)
            - **Store Website**: https://rahulmart.vercel.app
            
            ### Instructions to Install:
            1. Tap the **RahulSuperMart.apk** link below to download.
            2. When downloaded, open the file on your Android phone.
            3. If prompted with *"Install unknown apps"*, tap **Settings** and turn on **"Allow from this source"**.
            4. Tap **Install** to enjoy full wholesale shopping, Today's Deals, and 1-tap PNG Invoice downloads!
          files: release-output/RahulSuperMart.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
